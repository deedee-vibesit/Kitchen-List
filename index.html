<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen List</title>
<style>
:root{color-scheme:light;--ink:#25271e;--paper:#faf7ed;--green:#dfe8b7;--line:#dcd7c7}*{box-sizing:border-box}body{margin:0;background:#eae5d8;color:var(--ink);font:16px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #65832a;outline-offset:3px}button:disabled{opacity:.55}main{max-width:590px;min-height:100svh;margin:auto;background:var(--paper) center/cover fixed;position:relative;padding:22px clamp(18px,5vw,34px) 40px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px}header{border-bottom:1px solid var(--line);padding-bottom:16px}header,footer,.sheet,.intro{background:var(--paper)}.brand,.eyebrow{font-size:.73rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800}.eyebrow{color:#535d35}.intro{margin:30px 0 22px;padding:14px 16px;border-radius:16px;position:relative}h1{font:normal clamp(2.7rem,11vw,4.6rem)/.95 "Myriad Pro", "Segoe UI", Arial, sans-serif;letter-spacing:-.065em;margin:8px 0 14px;overflow-wrap:anywhere}p{margin:8px 0;color:#4f5245}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:148px;border:1px solid #393b2d;border-radius:16px;text-align:left;padding:13px;display:flex;flex-direction:column;justify-content:space-between;overflow-wrap:anywhere}.tile strong{font:normal clamp(1.26rem,5vw,1.85rem) "Myriad Pro", "Segoe UI", Arial, sans-serif}.tile:nth-child(4n+1){background:#dfe8b7}.tile:nth-child(4n+2){background:#f2d6c4}.tile:nth-child(4n+3){background:#f1e5a8}.tile:nth-child(4n){background:#ddd9eb}.tile span{font-size:.78rem}.pill,.primary{border:1px solid var(--ink);border-radius:999px;padding:9px 14px;background:var(--paper)}.primary{background:var(--ink);color:white}.sheet{border-radius:16px;padding:16px;margin-top:15px;border:1px solid var(--line)}form{margin:0}.add{display:flex;gap:8px}.add input{min-width:0;flex:1}input:not([type=checkbox]){padding:10px;border:1px solid #aaa694;border-radius:8px;background:#fffdf8;width:100%}input[type=checkbox]{width:20px;height:20px;accent-color:#4a602a;flex:none}.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}.row label{display:flex;align-items:center;gap:8px;flex:1;overflow-wrap:anywhere;min-width:0}.done span{text-decoration:line-through}.remove{background:none;border:0;font-size:1.4rem;min-width:40px;min-height:42px}footer{padding:12px;margin-top:22px;border-radius:12px;font-size:.8rem}.field{display:grid;gap:6px;margin:12px 0}.asset{margin:16px 0}.asset img{display:block;max-height:75px;max-width:100%;margin:8px 0}.sticker{width:65px;height:65px;object-fit:contain;position:absolute;right:12px;top:8px;pointer-events:none}.sticker+div{padding-right:65px}.status{min-height:1.4em;margin-top:12px;color:#8a3924}button, a{-webkit-tap-highlight-color:transparent}

html[data-theme="dark"]{color-scheme:dark;--ink:#f8efdf;--paper:#241c23;--line:#68515e}
html[data-theme="dark"] body{background:#1a1319}
html[data-theme="dark"] p,html[data-theme="dark"] .eyebrow{color:#e4c6d4}
html[data-theme="dark"] .tile{color:#25271e}
html[data-theme="dark"] input:not([type=checkbox]){background:#352833;color:#fff}
html[data-theme="dark"] .primary{color:#241c23}
.theme-toggle{border:1px solid currentColor;border-radius:999px;padding:8px 13px;background:var(--paper);min-height:42px;font-size:.78rem;font-weight:700;white-space:nowrap}
.landing-theme{position:absolute;right:max(16px,env(safe-area-inset-right));top:16px;z-index:3}
main.landing{max-width:none;min-height:100svh;display:grid;place-items:center;padding:68px 12px 32px;overflow:hidden;isolation:isolate;background-color:var(--paper);background-image:repeating-conic-gradient(#906a7c12 0% 25%,transparent 0% 50%),repeating-conic-gradient(#906a7c0d 0% 25%,transparent 0% 50%);background-size:3px 3px,11px 11px}
.landing-frame{width:min(100%,660px);display:grid;justify-items:center;gap:clamp(12px,2svh,20px);position:relative}
.landing-frame::before,.landing-frame::after{content:"";position:absolute;pointer-events:none;z-index:-1;width:clamp(235px,68vw,495px);height:clamp(320px,84svh,630px);background:url(pixel-flowers.svg) center/contain no-repeat;image-rendering:pixelated}
.landing-frame::before{right:57%;top:9%;transform:rotate(-12deg);opacity:.30}
.landing-frame::after{left:58%;top:15%;transform:scaleX(-1) rotate(-18deg);opacity:.20}
 .landing-title{width:min(98%,530px);margin:0 0 clamp(-44px,-8vw,-26px);z-index:1;pointer-events:none;animation:title-in 1.75s ease-out .38s both}
.landing-title svg{display:block;width:100%;overflow:visible}
.wordmark-letters{fill:var(--ink);stroke:var(--paper);stroke-width:70;stroke-linejoin:round;paint-order:stroke fill}
@keyframes title-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.landing-art{width:min(78%,390px);aspect-ratio:9/16;display:block;border-radius:13px;transform-origin:48% 74%;animation:arrive 1050ms cubic-bezier(.17,.79,.23,1) both;box-shadow:5px 8px 0 #ce5b8d37}
.landing-art img{width:100%;height:100%;display:block;border-radius:inherit;object-fit:contain;background:#151116}
.club-line{width:min(92%,388px);height:auto;display:block;margin-top:1px;overflow:visible;fill:var(--ink);font:600 20px 'Myriad Pro', 'Myriad Web Pro', 'Segoe UI', Arial,sans-serif;letter-spacing:2.2px}
.enter-list{padding:12px 23px;min-height:46px}
@keyframes arrive{0%{opacity:0;transform:translate(-26px,44px) rotate(-12deg) scale(.68);clip-path:inset(52% 0 0)}56%{opacity:1;clip-path:inset(0);transform:translate(5px,-7px) rotate(3deg) scale(1.035)}80%{transform:translate(-2px,2px) rotate(-1deg) scale(.99)}100%{opacity:1;transform:none;clip-path:inset(0)}}
@media(max-width:480px){main.landing{padding:62px 8px 24px}}
@media(prefers-reduced-motion:reduce){.landing-art,.landing-title{animation:none}}

main.floral-list {
  isolation:isolate;
  overflow:hidden;
  background-image:var(--list-art,none),repeating-conic-gradient(#906a7c12 0% 25%,transparent 0% 50%),repeating-conic-gradient(#906a7c0d 0% 25%,transparent 0% 50%);
  background-size:cover,3px 3px,11px 11px;
  background-position:center;
  background-repeat:no-repeat,repeat,repeat;
  background-attachment:scroll;
}
.floral-list::before,.floral-list::after {
  content:"";position:absolute;pointer-events:none;z-index:-1;
  width:clamp(235px,68vw,495px);height:clamp(320px,84svh,630px);
  background:url(pixel-flowers.svg) center/contain no-repeat;
  image-rendering:pixelated;
}
.floral-list::before {right:57%;top:100px;transform:rotate(-12deg);opacity:.30}
.floral-list::after {left:58%;top:270px;transform:scaleX(-1) rotate(-18deg);opacity:.20}
.floral-list .intro,.floral-list .sheet,.floral-list header,.floral-list footer {
  background:color-mix(in srgb,var(--paper) 94%,transparent);
}
.floral-list .grid {grid-auto-rows:1fr}
.tile {position:relative;isolation:isolate;min-height:0;aspect-ratio:1;border:0;gap:6px;justify-content:flex-end;overflow:hidden;padding:clamp(9px,3vw,16px)}
.tile strong {display:block;font-size:clamp(1rem,4.85vw,1.65rem);font-weight:700;line-height:1.04}
.tile span:last-child {margin-top:0}
html[data-theme="dark"] .tile.has-cover,.tile.has-cover {color:#fff;background:#181019}
.tile.has-cover::after {
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to bottom,transparent 36%,rgba(15,10,16,.86));
  pointer-events:none;
}
.tile-cover {position:absolute;inset:0;z-index:-2}
.tile-cover img,.store-cover img {display:block;width:100%;height:100%;object-fit:cover}
.store-cover {width:min(100%,335px);aspect-ratio:4/3;overflow:hidden;border-radius:12px;margin:18px auto 0;background:var(--paper)}
.store-cover.misc-cover {aspect-ratio:332/310}
.store-cover.misc-cover img {transform:scale(1.18)}
.store-cover + .intro {margin-top:12px}

<body>
<main id="app"><header><span class="brand">Kitchen List</span></header><p>Opening your list…</p></main>
<script>
'use strict';
// Set only the public Supabase project URL and publishable key for shared mode.
const config = { url: '', key: '' };
const shared = Boolean(config.url && config.key);
const defaults = {
  stores: ['Independent','Food Basics','Dollarama','Miscellaneous'].map((name,i)=>({id:String(i+1),name})),
  artwork: {}
};
const app = document.querySelector('#app');
let design = structuredClone(defaults), items = [], db, role = shared ? '' : 'owner';
let draft, busy = false, message = '';

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem('kitchen.'+key)) ?? fallback; }
  catch { return fallback; }
}
function save(key, value) { localStorage.setItem('kitchen.'+key, JSON.stringify(value)); }
let theme = load('theme',matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.dataset.theme=theme;
function themeButton(extra='') {
  const label = () => theme==='dark' ? '☀' : '☾';
  const toggle = button(label(),()=>{
    theme=theme==='dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme=theme;
    toggle.textContent=label();
    try { save('theme',theme); } catch {}
  },'theme-toggle '+extra);
  return toggle;
}
function el(tag, value, cls) {
  const node = document.createElement(tag);
  if (value) node.textContent = value;
  if (cls) node.className = cls;
  return node;
}
function button(label, action, cls='pill') {
  const node = el('button',label,cls);
  node.type = 'button';
  node.onclick = action;
  return node;
}
function route(path) { location.hash = path; }
function current() { return location.hash.slice(1); }
function result(response) {
  if (response.error) throw new Error(response.error.message);
  return response.data;
}
async function refresh() {
  if (!shared) {
    design = load('design',structuredClone(defaults));
    items = load('items',[]);
    return;
  }
  const {session} = result(await db.auth.getSession());
  role = '';
  if (!session) return;
  const membership = result(await db.from('kitchen_members').select('role').eq('user_id',session.user.id).maybeSingle());
  role = membership?.role || 'guest';
  if (role === 'guest') return;
  const [settings, rows] = await Promise.all([
    db.from('kitchen_design').select('value').eq('id',1).single(),
    db.from('kitchen_items').select('*').order('created_at')
  ]);
  design = result(settings).value;
  items = result(rows);
}
function status() {
  const line = el('p',message,'status');
  line.id = 'status';
  line.setAttribute('role','status');
  app.append(line);
}
async function action(fn) {
  if (busy) return;
  busy = true;
  message = '';
  const mainForm = document.activeElement?.closest('form');
  const controls = mainForm ? [...mainForm.querySelectorAll('button,input')].filter(x=>!x.disabled) : [];
  controls.forEach(x=>x.disabled=true);
  try { await fn(); render(); }
  catch (error) {
    message = error.message || 'Something went wrong. Try again.';
    const line = document.querySelector('#status');
    if (line) line.textContent = message;
    else render();
  } finally {
    controls.forEach(x=>x.disabled=false);
    busy = false;
  }
}
function safeImage(source) {
  return typeof source==='string' && /^data:image\/(png|jpeg|webp);base64,[a-z0-9+/=]+$/i.test(source) ? source : '';
}
function image(source, cls) {
  const node = el('img','',cls);
  node.src = safeImage(source);
  node.alt = '';
  return node;
}
function landing() {
  const frame = el('section','','landing-frame');
  const art = el('picture','','landing-art');
  const custom = safeImage(design.artwork.opening);
  if (!custom) {
    const still = el('source');
    still.media = '(prefers-reduced-motion: reduce)';
    still.srcset = 'intro-still.jpg';
    art.append(still);
  }
  const visual = el('img');
  visual.src = custom || 'intro.gif';
  visual.alt = 'A collage of an elephant and a red bottle against a textured backdrop';
  art.append(visual);
  const title = el('h1','','landing-title');
  title.setAttribute('aria-label','What’s Cooking!!');
  title.innerHTML = `<svg viewBox="0 0 480 108" aria-hidden="true">

  const club = el('div');
  club.innerHTML = `<svg class="club-line" viewBox="0 0 300 43" role="img" aria-label="The Kitchen Club">
    <defs><path id="accent-arc" d="M12 15 Q150 46 288 15"/></defs>

  </svg>`;
  frame.append(title,art,club.firstElementChild,button('open list',()=>route('list'),'primary enter-list'));
  app.append(themeButton('landing-theme'),frame);
}
function intro(label, title, copy) {
  const box = el('div','','intro'), text = el('div');
  if (safeImage(design.artwork.sticker)) box.append(image(design.artwork.sticker,'sticker'));
  text.append(el('div',label,'eyebrow'),el('h1',title),el('p',copy));
  box.append(text);
  app.append(box);
}
const storeCovers = new Map([
  ['independent','cover-independent.webp'],
  ['foodbasics','cover-food-basics.webp'],
  ['dollarama','cover-dollarama.webp'],
  ['miscellaneous','cover-miscellaneous.webp'],
  ['misc','cover-miscellaneous.webp']
]);
function coverFor(store, className) {
  const src = storeCovers.get(store.name.toLowerCase().replace(/\s/g,''));
  if (!src) return null;
  const frame = el('div','',className), artwork = el('img');
  if (className==='store-cover' && src==='cover-miscellaneous.webp') frame.classList.add('misc-cover');
  artwork.src=src;
  artwork.alt='';
  artwork.width=1000;
  artwork.height=750;
  frame.append(artwork);
  return frame;
}
function menu() {
  intro('GIRL DINNER LIST','Where to?','Pick a store to add or check off an item.');
  const grid = el('div','','grid');
  design.stores.forEach(store=>{
    const count = items.filter(item=>item.store_id===store.id&&!item.done).length;
    const tile = button('',()=>route('store/'+store.id),'tile');
    const cover = coverFor(store,'tile-cover');
    if (cover) {
      tile.classList.add('has-cover');
      tile.append(cover);
    }
    tile.append(el('strong',store.name),el('span',count+' to pick up'));
    grid.append(tile);
  });
  app.append(grid);
}
async function changeItem(kind,item) {
  if (shared) {
    const table = db.from('kitchen_items');
    if (kind==='add') result(await table.insert(item).select('id').single());
    if (kind==='toggle') result(await table.update({done:item.done}).eq('id',item.id).select('id').single());
    if (kind==='remove') result(await table.delete().eq('id',item.id).select('id').single());
  } else {
    let next = load('items',[]);
    if (kind==='add') next.push({...item,id:crypto.randomUUID()});
    if (kind==='toggle') next = next.map(row=>row.id===item.id ? {...row,done:item.done} : row);
    if (kind==='remove') next = next.filter(row=>row.id!==item.id);
    save('items',next);
  }
  await refresh();
}
function storePage(store) {
  const cover = coverFor(store,'store-cover');
  if (cover) app.append(cover);
  intro('STORE LIST',store.name,'Add it while it’s on your mind.');
  const box = el('section','','sheet'), form = el('form','','add'), field = el('input');
  field.placeholder='Add an item'; field.required=true; field.maxLength=160; field.setAttribute('aria-label','Add an item');
  const add = el('button','Add','primary');
  form.append(field,add);
  form.onsubmit = event=>{
    event.preventDefault();
    const name = field.value.trim();
    if (name) action(()=>changeItem('add',{name,store_id:store.id,done:false})).then(()=>{
      if (!message) document.querySelector('.add input')?.focus();
    });
  };
  box.append(form);
  const rows = items.filter(item=>item.store_id===store.id).sort((a,b)=>Number(a.done)-Number(b.done));
  if (!rows.length) box.append(el('p','Your list is empty.'));
  rows.forEach(item=>{
    const row = el('div','','row'), label = el('label','',item.done?'done':''), checkbox = el('input');
    checkbox.type='checkbox'; checkbox.checked=item.done;
    checkbox.onchange = ()=>{
      const done=checkbox.checked;
      checkbox.checked=item.done;
      action(()=>changeItem('toggle',{...item,done}));
    };
    label.append(checkbox,el('span',item.name));
    const remove = button('×',()=>action(()=>changeItem('remove',item)),'remove');
    remove.setAttribute('aria-label','Remove '+item.name);
    row.append(label,remove); box.append(row);
  });
  app.append(box);
}
function field(label,type,value) {
  const wrapper = el('label','','field'), input = el('input');
  input.type=type; if(value) input.value=value;
  wrapper.append(el('span',label),input);
  return [wrapper,input];
}
async function artwork(file) {
  if (!['image/png','image/jpeg','image/webp'].includes(file.type)) throw new Error('Choose a PNG, JPG, or WebP image.');
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1,1000/Math.max(bitmap.width,bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(bitmap.width*scale)); canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
  bitmap.close();
  const url=canvas.toDataURL('image/webp',.82);
  if (url.length>650000) throw new Error('This artwork is too large. Try a smaller export.');
  return url;
}
function settings() {
  draft ??= structuredClone(design);
  intro('OWNER TOOLS','Make it yours.','Upload your artwork and name your shopping lists.');
  const form = el('form','','sheet');
  draft.stores.forEach(store=>{
    const [label,input]=field('Store name','text',store.name);
    input.required=true; input.maxLength=45;
    input.oninput=()=>store.name=input.value;
    form.append(label);
  });
  if (draft.stores.length<24) form.append(button('+ Add a store',()=>{
    draft.stores.push({id:crypto.randomUUID(),name:''});
    render();
    const names = document.querySelectorAll('input[type=text]');
    names[names.length-1]?.focus();
  }));
  for (const [key,title] of [['opening','Opening graphic'],['background','Page background'],['sticker','Sticker']]) {
    const box=el('div','','asset');
    const [label,input]=field(title,'file');
    input.accept='image/png,image/jpeg,image/webp';
    input.onchange=()=>{const file=input.files[0];if(file) action(async()=>{draft.artwork[key]=await artwork(file);});};
    box.append(label);
    if(safeImage(draft.artwork[key])) box.append(image(draft.artwork[key]),button('Remove '+title.toLowerCase(),()=>{delete draft.artwork[key];render();}));
    form.append(box);
  }
  form.append(el('button','Save design','primary'));
  form.onsubmit=event=>{
    event.preventDefault();
    action(async()=>{
      if(draft.stores.some(store=>!store.name.trim())) throw new Error('Give every store a name.');
      draft.stores.forEach(store=>store.name=store.name.trim());
      if(shared) result(await db.from('kitchen_design').update({value:draft}).eq('id',1).select('id').single());
      else save('design',draft);
      draft=null;
      await refresh(); route('list');
    });
  };
  app.append(form);
}
function login() {
  intro('THE KITCHEN CLUB','Come on in.','Sign in to open the shared shopping lists.');
  const form=el('form','','sheet');
  const [emailLabel,email]=field('Email','email'), [passLabel,password]=field('Password','password');
  email.required=password.required=true; email.autocomplete='username'; password.autocomplete='current-password';
  form.append(emailLabel,passLabel,el('button','Sign in','primary'));
  form.onsubmit=event=>{
    event.preventDefault();
    action(async()=>{result(await db.auth.signInWithPassword({email:email.value.trim(),password:password.value}));await refresh();});
  };
  app.append(form);
}
function render() {
  const path=current();
  if(path!=='design') draft=null;
  app.replaceChildren();
  app.classList.toggle('landing',!path);
  app.classList.toggle('floral-list',path==='list'||path.startsWith('store/'));
  if (!path) {
    app.style.removeProperty('--list-art');
    app.style.backgroundImage = '';
    landing();
    return;
  }
  const background=safeImage(design.artwork.background);
  app.style.removeProperty('--list-art');
  if (app.classList.contains('floral-list')) {
    app.style.backgroundImage = '';
    if (background) app.style.setProperty('--list-art','url("'+background+'")');
  } else {
  app.style.backgroundImage=background ? 'url("'+background+'")' : '';
  }
  const header=el('header');
  header.append(path==='list' ? button('⌂',()=>route('')) : button('← Stores',()=>route('list')));
  if (role==='owner'&&path!=='design') header.append(button('Customize',()=>route('design')));
  header.append(themeButton());
  app.append(header);
  const store=design.stores.find(x=>'store/'+x.id===path);
  if (!role) login();
  else if(role==='guest') intro('INVITE REQUIRED','You’re signed in.','Ask the owner to give this account access.');
  else if(path==='design'&&role==='owner') settings();
  else if(store) storePage(store);
  else menu();
  status();
  const footer=el('footer');
  footer.append(el('span',shared ? 'Kitchen List · Shared mode' : 'Preview · Saves on this browser'));
  if(shared && role) footer.append(button('Sign out',()=>action(async()=>{
    result(await db.auth.signOut()); role=''; design=structuredClone(defaults); items=[]; draft=null; route('');
  })));
  app.append(footer);
}
async function start() {
  try {
    if(shared) {
      const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
      db=createClient(config.url,config.key);
    }
    await refresh();
    render();
    window.addEventListener('hashchange',()=>{message='';render();});
    window.addEventListener('storage',event=>{
      if(!shared&&event.key?.startsWith('kitchen.')&&current()!=='design') action(refresh);
    });
    if(shared) {
      const sync=()=>{
        if(role && !busy && !document.hidden && current() && current()!=='design') {
          const input=document.querySelector('.add input');
          if(!input?.value&&!app.contains(document.activeElement)) action(refresh);
        }
      };
      window.addEventListener('focus',sync);
      setInterval(sync,5000);
    }
  } catch(error) {app.replaceChildren(el('p','Could not open Kitchen List. '+error.message));}
}
start();
</script>
